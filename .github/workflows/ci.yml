name: CI

# Compile check on the iOS Simulator (no signing, no upload).
# Runs on every push to main so you see build errors before spending a TestFlight run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=xcode::No Xcode 26 on this runner"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=selected::$(xcodebuild -version | tr '\n' ' ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild build \
            -project iLife.xcodeproj \
            -scheme iLife \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          set -e
          tail -30 "$RUNNER_TEMP/build.log"
          if [ $status -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -25 | cut -c1-900 \
              | while IFS= read -r line; do echo "::error title=compile::$line"; done
            exit $status
          fi
