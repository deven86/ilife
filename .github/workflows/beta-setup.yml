name: TestFlight external testers

# Sets up external TestFlight testing and prints the public link.
on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Contact phone for Apple's beta reviewer (masked in logs)"
        required: true
      email:
        description: "Feedback / contact email"
        required: true
      limit:
        description: "Max testers via public link"
        default: "4"
      group:
        description: "External group name (a new name gives a new link)"
        default: "iLife Testers"
      close_old:
        description: "Comma-separated groups whose public link to switch off"
        default: ""

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Mask contact details
        run: |
          echo "::add-mask::${{ inputs.phone }}"
      - uses: actions/checkout@v5
      - name: Write key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8_BASE64 }}" > "$RUNNER_TEMP/keys/raw"
          if grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/raw"; then cp "$RUNNER_TEMP/keys/raw" "$RUNNER_TEMP/keys/AuthKey.p8"; else tr -d ' \r\n' < "$RUNNER_TEMP/keys/raw" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"; fi
          rm -f "$RUNNER_TEMP/keys/raw"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Set up testing
        env:
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          LIMIT: ${{ inputs.limit }}
          FIRST: Devendra
          LAST: Jondhale
          GROUP: ${{ inputs.group }}
          CLOSE_OLD: ${{ inputs.close_old }}
          PRIVACY_URL: https://docs.google.com/document/d/13UFj2pC7G9h39CxLby--7_dpnnKf_XJTFRJBcS-d_Gk/view
          DESCRIPTION: >-
            iLife is a private health, workout and diet tracker for iPhone and iPad. Log meals, water, workouts and body
            measurements, sync with Apple Health and Apple Watch, follow workout plans, track supplements and prescribed
            medicines with reminders, keep injuries, major health events and medical reports with photos and bills, manage
            gym memberships and expenses, do guided meditation, and track family members separately. Optional AI features
            use your own API key. All data stays on your device and your own iCloud.
          WHATS_NEW: >-
            New in 1.8: sign in with your own Apple ID and create your own profile — your records are separate and private
            to you. Free on-device AI with Apple Intelligence (iPhone 15 Pro or newer), and Siri: "log water in iLife",
            "how's my day in iLife". Please try: sign in, set up your profile, connect Apple Health, log food, water and a
            workout, add a medicine with a photo, add a family member, ask the coach. Report problems with TestFlight feedback.
          REVIEW_NOTES: >-
            Sign in with Apple is required and works with any Apple ID (no demo account needed); each Apple ID has its own
            separate records. There is no server: data stays on the device, and in the user's private iCloud only if they turn
            that on. Apple Health access is optional. AI uses Apple Intelligence on-device by default; Claude needs the user's
            own key and can be skipped. Face ID lock is optional (More > Security).
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 ci/beta_setup.py
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
