name: iLife
options:
  bundleIdPrefix: com.jondhale
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # passed in CI as DEVELOPMENT_TEAM=...
    CODE_SIGN_STYLE: Automatic

targets:
  iLife:
    type: application
    platform: iOS
    sources:
      - path: iLife
      - path: Shared
    dependencies:
      - target: iLifeWidgets
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.ilife"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.ilife
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: iLife/iLife.entitlements
    info:
      path: iLife/Info.plist
      properties:
        CFBundleDisplayName: iLife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: iLife reads steps, sleep, heart rate, workouts, nutrition and body measurements from Apple Health to build your dashboard.
        NSHealthUpdateUsageDescription: iLife saves your meals, water, workouts and InBody results to Apple Health.
        NSFaceIDUsageDescription: iLife uses Face ID to protect your health and medical records.
        NSCameraUsageDescription: iLife uses the camera to scan InBody results and medical reports.
        NSPhotoLibraryUsageDescription: iLife lets you pick InBody results and reports from your photos.
        NSAppleMusicUsageDescription: iLife plays your Apple Music workout playlist when a session starts.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - audio
          - remote-notification
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iLife/iLife.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.jondhale.ilife
        com.apple.developer.icloud-container-identifiers:
          - iCloud.group.com.jondhale.ilife
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: production
        com.apple.developer.default-data-protection: NSFileProtectionComplete

  iLifeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: iLifeWidgets
      - path: Shared
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.jondhale.ilife.widgets"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jondhale.ilife.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: iLifeWidgets/iLifeWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: iLifeWidgets/Info.plist
      properties:
        CFBundleDisplayName: iLife
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iLifeWidgets/iLifeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jondhale.ilife

schemes:
  iLife:
    build:
      targets:
        iLife: all
        iLifeWidgets: all
    archive:
      config: Release
